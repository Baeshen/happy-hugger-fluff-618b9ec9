name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier format check (guards against lint prettier/prettier failures)
        run: bun run format:check

      - name: Lint insert routes (friendlyInsertError guardrails on book + pharmacy + …)
        run: bun run lint:inserts

      - name: Verify docs examples match lint:inserts rules
        run: bash tests/lint/book-docs-examples.sh

      - name: Verify FRIENDLY_INSERT_MESSAGES keys mentioned in docs exist & are wired
        run: bun tests/unit/book-docs-keys.test.ts

      - name: Unit tests
        run: |
          set -e
          for f in tests/unit/*.test.ts; do
            echo "── $f ──"
            bun "$f"
          done

      - name: TypeScript check
        run: bun run typecheck

  rls-tests-main:
    name: RLS integration tests (main — strict)
    runs-on: ubuntu-latest
    # Runs ONLY on push to main. Missing Supabase secrets = hard failure.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Supabase secrets are present (required on main)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          missing=()
          [ -z "$SUPABASE_URL" ] && missing+=("SUPABASE_URL")
          [ -z "$SUPABASE_PUBLISHABLE_KEY" ] && missing+=("SUPABASE_PUBLISHABLE_KEY")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## ❌ RLS tests failed on main"
              echo ""
              echo "The following Supabase secrets are **required** on the \`main\` branch but are missing:"
              for s in "${missing[@]}"; do
                echo "- \`$s\`"
              done
              echo ""
              echo "Add them here: [Repository secrets](https://github.com/${{ github.repository }}/settings/secrets/actions)"
              echo ""
              echo "Note: \`SUPABASE_SERVICE_ROLE_KEY\` is not available on Lovable Cloud. For full RLS tests you need a separate Supabase project."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::RLS tests failed on main — missing secrets: ${missing[*]}. See job summary for details."
            exit 1
          fi
          echo "✅ All Supabase secrets present — running full RLS suite."

      - name: Run tests/rls/* against live Supabase (strict)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          failed=0
          for f in tests/rls/*.test.ts; do
            echo "── $f ──"
            if ! bun "$f"; then
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed RLS test file(s) failed."
            exit 1
          fi

  rls-tests-pr:
    name: RLS integration tests (PR — skip mode allowed)
    runs-on: ubuntu-latest
    # Runs ONLY on pull requests from the same repo (forks redact secrets).
    # Missing secrets = clean skip with a clear summary; never fails the PR.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests/rls/* against live Supabase (skip if secrets missing)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            {
              echo "## ⚠️ RLS tests skipped (PR skip mode)"
              echo ""
              echo "Supabase secrets are missing — PR runs are allowed to skip; \`main\` is strict."
              echo ""
              echo "Required secrets:"
              echo "- \`SUPABASE_URL\`"
              echo "- \`SUPABASE_PUBLISHABLE_KEY\`"
              echo "- \`SUPABASE_SERVICE_ROLE_KEY\`"
              echo ""
              echo "Add them here: [Repository secrets](https://github.com/${{ github.repository }}/settings/secrets/actions)"
              echo ""
              echo "Note: \`SUPABASE_SERVICE_ROLE_KEY\` is not available on Lovable Cloud. For full tests you need a separate Supabase project; otherwise this job will keep skipping safely on PRs."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::RLS tests skipped on PR — Supabase secrets not configured. See job summary."
            exit 0
          fi
          failed=0
          for f in tests/rls/*.test.ts; do
            echo "── $f ──"
            if ! bun "$f"; then
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed RLS test file(s) failed."
            exit 1
          fi
