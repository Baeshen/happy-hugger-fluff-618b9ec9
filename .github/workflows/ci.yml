name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier format check (guards against lint prettier/prettier failures)
        run: bun run format:check

      - name: Lint insert routes (friendlyInsertError guardrails on book + pharmacy + …)
        run: bun run lint:inserts

      - name: Verify docs examples match lint:inserts rules
        run: bash tests/lint/book-docs-examples.sh

      - name: Verify FRIENDLY_INSERT_MESSAGES keys mentioned in docs exist & are wired
        run: bun tests/unit/book-docs-keys.test.ts

      - name: Unit tests
        run: |
          set -e
          for f in tests/unit/*.test.ts; do
            echo "── $f ──"
            bun "$f"
          done

      - name: TypeScript check
        run: bun run typecheck

  rls-tests:
    name: RLS integration tests (live Supabase)
    runs-on: ubuntu-latest
    # Skip on PRs from forks — GitHub Actions redacts secrets there, so
    # the tests would run without env vars and self-skip anyway. Keeping
    # them off avoids empty green noise.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests/rls/* against live Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            if [ "$GITHUB_REF" == "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" == "push" ]; then
              {
                echo "## ❌ RLS tests failed on main"
                echo ""
                echo "Supabase secrets are required on the \`main\` branch."
                echo ""
                echo "Add these repository secrets:"
                echo "- \`SUPABASE_URL\`"
                echo "- \`SUPABASE_PUBLISHABLE_KEY\`"
                echo "- \`SUPABASE_SERVICE_ROLE_KEY\`"
                echo ""
                echo "Go to: **Settings → Secrets and variables → Actions → New repository secret**"
                echo ""
                echo "Note: \`SUPABASE_SERVICE_ROLE_KEY\` is not available on Lovable Cloud. For full tests you need a separate Supabase project."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::RLS tests failed on main — Supabase secrets are missing. See job summary for details."
              exit 1
            fi
            {
              echo "## ⚠️ RLS tests skipped"
              echo ""
              echo "Supabase secrets are missing on this repository."
              echo ""
              echo "To run the live RLS integration tests, add these repository secrets:"
              echo "- \`SUPABASE_URL\`"
              echo "- \`SUPABASE_PUBLISHABLE_KEY\`"
              echo "- \`SUPABASE_SERVICE_ROLE_KEY\`"
              echo ""
              echo "Go to: **Settings → Secrets and variables → Actions → New repository secret**"
              echo ""
              echo "Note: \`SUPABASE_SERVICE_ROLE_KEY\` is not available on Lovable Cloud. For full tests you need a separate Supabase project; otherwise the tests will continue to skip safely."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::RLS tests skipped — Supabase secrets are not configured. See job summary for details."
            exit 0
          fi
          failed=0
          for f in tests/rls/*.test.ts; do
            echo "── $f ──"
            if ! bun "$f"; then
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed RLS test file(s) failed."
            exit 1
          fi
