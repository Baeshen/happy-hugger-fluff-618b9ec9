name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint (book) & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier format check (guards against lint:book prettier/prettier failures)
        run: bun run format:check

      - name: Lint book routes (guardrails against friendlyInsertError import conflicts)
        run: bun run lint:book

      - name: Verify docs examples match lint:book rules
        run: bash tests/lint/book-docs-examples.sh

      - name: Verify FRIENDLY_INSERT_MESSAGES keys mentioned in docs exist & are wired
        run: bun tests/unit/book-docs-keys.test.ts

      - name: TypeScript check
        run: bun run typecheck
